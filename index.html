<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffd400" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='15' fill='%23121212'/%3E%3Cpath d='M9 22V10h3v12zm11 0V10h3v12zM12 14h8v3h-8z' fill='%23ffd400'/%3E%3C/svg%3E"
    />
    <title>Trainingsplan-Generator</title>
  </head>
  <body>
    <header class="site-header">
      <div class="site-header-inner">
        <p class="kicker">Calisthenics · Zuhause &amp; Park</p>
        <h1>Trainings&shy;plan</h1>
      </div>
    </header>

    <main class="layout">
      <form id="plan-form" class="panel">
        <fieldset class="field">
          <legend>Erfahrung</legend>
          <div class="segments">
            <label>
              <input type="radio" name="level" value="1" checked />
              <span>Anfänger</span>
            </label>
            <label>
              <input type="radio" name="level" value="2" />
              <span>Fortgeschritten</span>
            </label>
            <label>
              <input type="radio" name="level" value="3" />
              <span>Profi</span>
            </label>
          </div>
        </fieldset>

        <fieldset class="field">
          <legend>Trainingstage pro Woche</legend>
          <div class="segments segments-numbers">
            <label>
              <input type="radio" name="days" value="2" />
              <span>2</span>
            </label>
            <label>
              <input type="radio" name="days" value="3" checked />
              <span>3</span>
            </label>
            <label>
              <input type="radio" name="days" value="4" />
              <span>4</span>
            </label>
            <label>
              <input type="radio" name="days" value="5" />
              <span>5</span>
            </label>
          </div>
        </fieldset>

        <fieldset class="field">
          <legend>Ziel</legend>
          <div class="segments">
            <label>
              <input type="radio" name="goal" value="kraft" />
              <span>Kraft</span>
            </label>
            <label>
              <input type="radio" name="goal" value="muskelaufbau" checked />
              <span>Muskelaufbau</span>
            </label>
            <label>
              <input type="radio" name="goal" value="ausdauer" />
              <span>Ausdauer</span>
            </label>
          </div>
        </fieldset>

        <fieldset class="field">
          <legend>Geräte</legend>
          <div class="chips">
            <label>
              <input type="checkbox" checked disabled />
              <span>Boden</span>
            </label>
            <label>
              <input type="checkbox" name="equipment" value="klimmzugstange" />
              <span>Klimmzugstange</span>
            </label>
            <label>
              <input type="checkbox" name="equipment" value="barren" />
              <span>Barren / Dip-Station</span>
            </label>
            <label>
              <input type="checkbox" name="equipment" value="ringe" />
              <span>Ringe</span>
            </label>
            <label>
              <input type="checkbox" name="equipment" value="baender" />
              <span>Widerstandsbänder</span>
            </label>
          </div>
        </fieldset>

        <button type="submit" class="button-go">Plan erstellen</button>
      </form>

      <div class="plan-column">
        <div id="plan-empty" class="empty">
          <p class="empty-mark" aria-hidden="true">→</p>
          <p>
            Stell links ein, was du kannst und was du dabei hast. Dein
            Wochenplan erscheint hier.
          </p>
        </div>

        <section id="plan" hidden>
          <div class="plan-header">
            <h2>Dein Wochenplan</h2>
            <button type="button" id="print" class="button-ghost">
              Drucken
            </button>
          </div>
          <ul id="plan-summary" class="summary"></ul>
          <div id="plan-days"></div>
        </section>
      </div>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
